services:
  onyx:
    build:
      context: .
      dockerfile: Dockerfile
    image: onyx-utility-core:5.0.4
    container_name: onyx-utility-core
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      DATABASE_URL: /app/data/database.db
      FFMPEG_PATH: /usr/bin/ffmpeg
      NODE_ENV: production
    volumes:
      - onyx-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    stop_signal: SIGTERM
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.ADMIN_HTTP_PORT;if(!p)process.exit(0);fetch('http://127.0.0.1:'+p+'/health').then(r=>r.json()).then(j=>process.exit(j&&j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  onyx-data: